<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Repository — Upload & Browse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Merriweather:wght@300;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #0b0b0b;
      --carbon-90: #1a1a1a;
      --carbon-80: #2b2b2b;
      --carbon-60: #58585b;
      --carbon-40: #8e8e8e;
      --carbon-30: #b9b9bb;
      --carbon-20: #d9d9d9;
      --carbon-05: #f5f5f5;
      --white: #f7f5f4;

      --blue:      #1a5fa8;
      --blue-dark: #134a85;
      --champ:     #b8973a;
      --champ-dark:#9a7d2e;
      --burg:      #7d2040;
      --burg-dark: #621832;
      --orange:    #c4601a;
      --orange-dark:#a34e14;

      --green: #2e7d4f;
      --red: #b83a3a;
    }

    body { font-family: 'Inter', sans-serif; background: var(--white); color: var(--black); line-height: 1.6; }
    a { color: inherit; text-decoration: none; }
    ul { list-style: none; }
    button { font-family: 'Inter', sans-serif; cursor: pointer; }
    input, select, textarea { font-family: 'Inter', sans-serif; }

    /* ── HEADER ── */
    .site-header {
      background: var(--black);
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
      height: 56px;
      gap: 24px;
    }

    .logo { font-family: 'Merriweather', serif; font-weight: 700; color: var(--white); font-size: 1.05rem; flex-shrink: 0; }

    .conn-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .conn-field {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 2px;
      padding: 6px 12px;
      transition: background .2s;
    }
    .conn-field:focus-within { background: rgba(255,255,255,0.11); border-color: rgba(255,255,255,0.25); }
    .conn-field input {
      background: none; border: none; outline: none;
      font-size: 0.78rem; color: var(--white);
      width: 200px;
    }
    .conn-field input::placeholder { color: var(--carbon-40); }
    .conn-field.key input { width: 160px; }

    .conn-status {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.72rem; font-weight: 600; color: var(--carbon-40);
      padding: 0 4px;
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--carbon-60); flex-shrink: 0;
      transition: background .2s;
    }
    .status-dot.connected { background: var(--green); }
    .status-dot.error { background: var(--red); }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      font-weight: 700; font-size: 0.83rem;
      padding: 9px 18px; border-radius: 2px;
      transition: opacity .2s; cursor: pointer;
      border: none; font-family: 'Inter', sans-serif;
      background: var(--white); color: var(--black);
    }
    .btn:hover { opacity: 0.88; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-dark { background: var(--black); color: var(--white); }
    .btn-outline { background: transparent; border: 2px solid rgba(255,255,255,0.5); color: var(--white); }
    .btn-sm { padding: 6px 14px; font-size: 0.76rem; }
    .btn-accent { background: var(--blue); color: var(--white); }
    .btn-accent:hover { background: var(--blue-dark); opacity: 1; }

    /* ── SECONDARY NAV ── */
    .secondary-nav {
      background: var(--carbon-90);
      border-bottom: 1px solid var(--carbon-80);
      overflow-x: auto;
      white-space: nowrap;
      position: sticky;
      top: 56px;
      z-index: 999;
    }
    .secondary-nav ul { display: inline-flex; padding: 0 32px; }
    .secondary-nav li a, .secondary-nav li button {
      display: block;
      padding: 12px 18px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--carbon-30);
      transition: color .2s;
      border-bottom: 3px solid transparent;
      background: none; border-top: none; border-left: none; border-right: none;
    }
    .secondary-nav li a:hover,
    .secondary-nav li a.active,
    .secondary-nav li button:hover,
    .secondary-nav li button.active { color: var(--white); border-bottom-color: rgba(255,255,255,0.4); }

    /* ── SECTIONS ── */
    section { padding: 44px 40px; }
    .inner { max-width: 1160px; margin: 0 auto; }

    .section-header { margin-bottom: 28px; }
    .label-tag {
      font-size: 0.68rem; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase;
      color: var(--carbon-40); margin-bottom: 6px;
    }
    .section-title { font-size: 1.45rem; font-weight: 700; }
    .section-sub { font-size: 0.85rem; color: var(--carbon-60); margin-top: 6px; }

    /* ── HIERARCHY PICKER ── */
    .picker-strip {
      background: var(--carbon-90);
      color: var(--white);
      padding: 28px 40px;
    }
    .picker-grid {
      max-width: 1160px; margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
    }
    @media (max-width: 960px) { .picker-grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 520px) { .picker-grid { grid-template-columns: 1fr; } }

    .picker-field label {
      display: block;
      font-size: 0.66rem; font-weight: 700;
      letter-spacing: 1.3px; text-transform: uppercase;
      color: var(--carbon-40); margin-bottom: 7px;
    }
    .picker-field select {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      color: var(--white);
      padding: 9px 10px;
      border-radius: 2px;
      font-size: 0.83rem;
      outline: none;
      transition: border-color .2s, background .2s;
    }
    .picker-field select:hover:not(:disabled) { background: rgba(255,255,255,0.1); }
    .picker-field select:focus { border-color: rgba(255,255,255,0.4); }
    .picker-field select:disabled { opacity: 0.35; cursor: not-allowed; }
    .picker-field select option { background: var(--carbon-90); color: var(--white); }

    /* ── UPLOAD PANEL ── */
    .panel {
      background: var(--white);
      border: 1px solid var(--carbon-20);
      border-radius: 3px;
      padding: 28px;
    }
    .form-row { margin-bottom: 18px; }
    .form-row label {
      display: block;
      font-size: 0.72rem; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase;
      color: var(--carbon-60); margin-bottom: 8px;
    }
    .form-row input[type=text],
    .form-row input[type=url],
    .form-row input[type=file],
    .form-row textarea {
      width: 100%;
      border: 1px solid var(--carbon-20);
      border-radius: 2px;
      padding: 10px 12px;
      font-size: 0.88rem;
      color: var(--black);
      outline: none;
      transition: border-color .2s;
      background: var(--white);
    }
    .form-row input[type=text]:focus,
    .form-row input[type=url]:focus,
    .form-row textarea:focus { border-color: var(--carbon-60); }
    .form-row textarea { resize: vertical; min-height: 140px; line-height: 1.7; }

    .type-tabs {
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .type-tab {
      background: var(--carbon-05);
      border: 1px solid var(--carbon-20);
      border-radius: 2px;
      padding: 8px 16px;
      font-size: 0.78rem; font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--carbon-60);
      transition: all .2s;
    }
    .type-tab:hover { background: var(--carbon-20); }
    .type-tab.active { color: var(--white); border-color: transparent; }
    .type-tab.active[data-type="text"]    { background: var(--carbon-90); }
    .type-tab.active[data-type="pdf"]     { background: var(--burg); }
    .type-tab.active[data-type="youtube"] { background: var(--orange); }
    .type-tab.active[data-type="spotify"] { background: var(--blue); }

    .type-field { display: none; }
    .type-field.active { display: block; }

    .form-actions {
      display: flex; align-items: center; gap: 12px; margin-top: 22px;
      padding-top: 20px; border-top: 1px solid var(--carbon-20);
    }
    .form-msg { font-size: 0.8rem; font-weight: 600; }
    .form-msg.ok { color: var(--green); }
    .form-msg.err { color: var(--red); }

    /* ── CONTENT LIST ── */
    .content-stack { display: flex; flex-direction: column; gap: 0; }
    .content-card {
      display: grid;
      grid-template-columns: 90px 1fr auto;
      gap: 20px;
      align-items: flex-start;
      padding: 22px 0;
      border-top: 1px solid var(--carbon-20);
    }
    .content-stack .content-card:last-child { border-bottom: 1px solid var(--carbon-20); }

    .content-type-tag {
      font-size: 0.62rem; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: #fff; padding: 4px 8px; border-radius: 2px;
      text-align: center; height: fit-content;
    }
    .content-type-tag.text    { background: var(--carbon-90); }
    .content-type-tag.pdf     { background: var(--burg); }
    .content-type-tag.youtube { background: var(--orange); }
    .content-type-tag.spotify { background: var(--blue); }

    .content-title { font-size: 0.98rem; font-weight: 700; margin-bottom: 8px; line-height: 1.35; }
    .content-body-text {
      font-size: 0.85rem; color: var(--carbon-60); line-height: 1.75;
      white-space: pre-wrap;
      max-height: 220px; overflow-y: auto;
      padding-right: 6px;
    }
    .content-meta { font-size: 0.72rem; color: var(--carbon-40); margin-top: 8px; }

    .content-embed { margin-top: 10px; }
    .content-embed iframe { width: 100%; max-width: 480px; border: none; border-radius: 2px; }
    .content-embed audio { width: 100%; max-width: 420px; }

    .content-actions { display: flex; gap: 8px; flex-shrink: 0; }

    /* ── EMPTY / STATUS STATES ── */
    .empty-state, .load-state {
      text-align: center; padding: 48px 20px;
      color: var(--carbon-40); font-size: 0.85rem;
    }

    .warn-banner {
      background: #fdf3e0; border: 1px solid var(--champ);
      color: var(--champ-dark);
      padding: 12px 16px; border-radius: 2px;
      font-size: 0.8rem; margin-bottom: 24px;
      display: flex; align-items: center; gap: 10px;
    }

    @media (max-width: 600px) {
      section { padding: 32px 20px; }
      .site-header { padding: 0 20px; height: auto; flex-wrap: wrap; padding-top: 10px; padding-bottom: 10px; }
      .picker-strip { padding: 24px 20px; }
      .content-card { grid-template-columns: 1fr; }
      .content-actions { flex-direction: row; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="site-header">
  <div class="logo">Data Repository</div>
  <div class="conn-bar">
    <div class="conn-field">
      <input type="text" id="sb-url" placeholder="Supabase Project URL" />
    </div>
    <div class="conn-field key">
      <input type="password" id="sb-key" placeholder="Anon (public) key" />
    </div>
    <button class="btn btn-outline btn-sm" id="connect-btn">Connect</button>
    <div class="conn-status">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">Not connected</span>
    </div>
  </div>
</header>

<!-- SECONDARY NAV -->
<nav class="secondary-nav">
  <ul>
    <li><a href="#browse" class="nav-link active" data-target="browse">Browse</a></li>
    <li><a href="#upload" class="nav-link" data-target="upload">Upload</a></li>
  </ul>
</nav>

<!-- HIERARCHY PICKER -->
<div class="picker-strip">
  <div class="picker-grid">
    <div class="picker-field">
      <label>Academic Year</label>
      <select id="sel-year" disabled><option value="">—</option></select>
    </div>
    <div class="picker-field">
      <label>Semester</label>
      <select id="sel-semester" disabled><option value="">—</option></select>
    </div>
    <div class="picker-field">
      <label>Module</label>
      <select id="sel-module" disabled><option value="">—</option></select>
    </div>
    <div class="picker-field">
      <label>Subject</label>
      <select id="sel-subject" disabled><option value="">—</option></select>
    </div>
    <div class="picker-field">
      <label>Lecture</label>
      <select id="sel-lecture" disabled><option value="">—</option></select>
    </div>
  </div>
</div>

<!-- BROWSE -->
<section id="browse" style="background:var(--white);">
  <div class="inner">
    <div class="section-header">
      <p class="label-tag">Indexed Content</p>
      <h2 class="section-title" id="browse-title">Select a lecture to view its content</h2>
    </div>
    <div id="browse-body">
      <div class="empty-state">Connect to Supabase and select Year → Semester → Module → Subject → Lecture above.</div>
    </div>
  </div>
</section>

<!-- UPLOAD -->
<section id="upload" style="background:var(--carbon-05);">
  <div class="inner">
    <div class="section-header">
      <p class="label-tag">Add Content</p>
      <h2 class="section-title">Upload to Lecture</h2>
      <p class="section-sub" id="upload-target-hint">Select a lecture above before uploading.</p>
    </div>

    <div class="panel">
      <div class="form-row">
        <label>Content Type</label>
        <div class="type-tabs">
          <button type="button" class="type-tab active" data-type="text">Text</button>
          <button type="button" class="type-tab" data-type="pdf">PDF</button>
          <button type="button" class="type-tab" data-type="youtube">YouTube</button>
          <button type="button" class="type-tab" data-type="spotify">Spotify</button>
        </div>
      </div>

      <div class="form-row">
        <label>Title</label>
        <input type="text" id="f-title" placeholder="e.g. Lecture 4 — Cardiac Cycle Overview" />
      </div>

      <div class="form-row type-field active" data-type="text">
        <label>Body Text</label>
        <textarea id="f-body" placeholder="Paste or write the content here…"></textarea>
      </div>

      <div class="form-row type-field" data-type="pdf">
        <label>PDF File</label>
        <input type="file" id="f-file" accept="application/pdf" />
      </div>

      <div class="form-row type-field" data-type="youtube">
        <label>YouTube URL</label>
        <input type="url" id="f-url-youtube" placeholder="https://www.youtube.com/watch?v=…" />
      </div>

      <div class="form-row type-field" data-type="spotify">
        <label>Spotify URL</label>
        <input type="url" id="f-url-spotify" placeholder="https://open.spotify.com/episode/…" />
      </div>

      <div class="form-actions">
        <button class="btn btn-dark" id="upload-btn">Upload</button>
        <span class="form-msg" id="upload-msg"></span>
      </div>
    </div>
  </div>
</section>

<script>
(function () {
  // ============================================================
  // State
  // ============================================================
  let supabase = null;
  let activeType = 'text';
  const selection = { year: null, semester: null, module: null, subject: null, lecture: null };

  const STORAGE_BUCKET = 'lecture-content';

  const els = {
    sbUrl: document.getElementById('sb-url'),
    sbKey: document.getElementById('sb-key'),
    connectBtn: document.getElementById('connect-btn'),
    statusDot: document.getElementById('status-dot'),
    statusText: document.getElementById('status-text'),

    selYear: document.getElementById('sel-year'),
    selSemester: document.getElementById('sel-semester'),
    selModule: document.getElementById('sel-module'),
    selSubject: document.getElementById('sel-subject'),
    selLecture: document.getElementById('sel-lecture'),

    browseTitle: document.getElementById('browse-title'),
    browseBody: document.getElementById('browse-body'),

    uploadHint: document.getElementById('upload-target-hint'),
    uploadBtn: document.getElementById('upload-btn'),
    uploadMsg: document.getElementById('upload-msg'),

    fTitle: document.getElementById('f-title'),
    fBody: document.getElementById('f-body'),
    fFile: document.getElementById('f-file'),
    fUrlYoutube: document.getElementById('f-url-youtube'),
    fUrlSpotify: document.getElementById('f-url-spotify'),
  };

  // ============================================================
  // Connection (credentials persisted to localStorage only —
  // never sent anywhere but the Supabase client itself)
  // ============================================================
  function loadSavedCreds() {
    const url = localStorage.getItem('repo_sb_url');
    const key = localStorage.getItem('repo_sb_key');
    if (url) els.sbUrl.value = url;
    if (key) els.sbKey.value = key;
    if (url && key) connect();
  }

  function setStatus(state, text) {
    els.statusDot.className = 'status-dot' + (state ? ' ' + state : '');
    els.statusText.textContent = text;
  }

  async function connect() {
    const url = els.sbUrl.value.trim();
    const key = els.sbKey.value.trim();
    if (!url || !key) {
      setStatus('error', 'URL and key required');
      return;
    }
    try {
      supabase = window.supabase.createClient(url, key);
      // Lightweight check: try a count query against academic_years
      const { error } = await supabase.from('academic_years').select('id', { count: 'exact', head: true });
      if (error) throw error;

      localStorage.setItem('repo_sb_url', url);
      localStorage.setItem('repo_sb_key', key);
      setStatus('connected', 'Connected');
      await loadYears();
    } catch (err) {
      supabase = null;
      setStatus('error', 'Connection failed — check URL/key & RLS');
      console.error(err);
    }
  }

  els.connectBtn.addEventListener('click', connect);

  // ============================================================
  // Cascading selects
  // ============================================================
  function resetSelect(sel, placeholder) {
    sel.innerHTML = `<option value="">${placeholder}</option>`;
    sel.disabled = true;
  }

  function fillSelect(sel, rows, labelFn) {
    sel.innerHTML = '<option value="">—</option>' +
      rows.map(r => `<option value="${r.id}">${labelFn(r)}</option>`).join('');
    sel.disabled = rows.length === 0;
  }

  async function loadYears() {
    resetSelect(els.selSemester, '—');
    resetSelect(els.selModule, '—');
    resetSelect(els.selSubject, '—');
    resetSelect(els.selLecture, '—');
    const { data, error } = await supabase
      .from('academic_years')
      .select('id, label')
      .order('label');
    if (error) { console.error(error); return; }
    fillSelect(els.selYear, data || [], r => r.label);
  }

  async function loadSemesters(yearId) {
    resetSelect(els.selModule, '—');
    resetSelect(els.selSubject, '—');
    resetSelect(els.selLecture, '—');
    const { data, error } = await supabase
      .from('semesters')
      .select('id, number, name')
      .eq('academic_year_id', yearId)
      .order('number');
    if (error) { console.error(error); return; }
    fillSelect(els.selSemester, data || [], r => r.name ? `${r.name} (Sem ${r.number})` : `Semester ${r.number}`);
  }

  async function loadModules(semesterId) {
    resetSelect(els.selSubject, '—');
    resetSelect(els.selLecture, '—');
    const { data, error } = await supabase
      .from('modules')
      .select('id, name, code')
      .eq('semester_id', semesterId)
      .order('name');
    if (error) { console.error(error); return; }
    fillSelect(els.selModule, data || [], r => r.code ? `${r.name} (${r.code})` : r.name);
  }

  async function loadSubjects(moduleId) {
    resetSelect(els.selLecture, '—');
    const { data, error } = await supabase
      .from('subjects')
      .select('id, name')
      .eq('module_id', moduleId)
      .order('name');
    if (error) { console.error(error); return; }
    fillSelect(els.selSubject, data || [], r => r.name);
  }

  async function loadLectures(subjectId) {
    const { data, error } = await supabase
      .from('lectures')
      .select('id, title, lecture_date')
      .eq('subject_id', subjectId)
      .order('lecture_date', { ascending: false, nullsFirst: false });
    if (error) { console.error(error); return; }
    fillSelect(els.selLecture, data || [], r => r.lecture_date ? `${r.title} — ${r.lecture_date}` : r.title);
  }

  els.selYear.addEventListener('change', () => {
    selection.year = els.selYear.value || null;
    selection.semester = selection.module = selection.subject = selection.lecture = null;
    updateUploadHint();
    if (selection.year) loadSemesters(selection.year);
  });

  els.selSemester.addEventListener('change', () => {
    selection.semester = els.selSemester.value || null;
    selection.module = selection.subject = selection.lecture = null;
    updateUploadHint();
    if (selection.semester) loadModules(selection.semester);
  });

  els.selModule.addEventListener('change', () => {
    selection.module = els.selModule.value || null;
    selection.subject = selection.lecture = null;
    updateUploadHint();
    if (selection.module) loadSubjects(selection.module);
  });

  els.selSubject.addEventListener('change', () => {
    selection.subject = els.selSubject.value || null;
    selection.lecture = null;
    updateUploadHint();
    if (selection.subject) loadLectures(selection.subject);
  });

  els.selLecture.addEventListener('change', () => {
    selection.lecture = els.selLecture.value || null;
    updateUploadHint();
    if (selection.lecture) {
      loadContent(selection.lecture, els.selLecture.options[els.selLecture.selectedIndex].text);
    } else {
      els.browseTitle.textContent = 'Select a lecture to view its content';
      els.browseBody.innerHTML = '<div class="empty-state">Connect to Supabase and select Year → Semester → Module → Subject → Lecture above.</div>';
    }
  });

  function updateUploadHint() {
    if (selection.lecture) {
      const label = els.selLecture.options[els.selLecture.selectedIndex].text;
      els.uploadHint.textContent = `Uploading to: ${label}`;
    } else {
      els.uploadHint.textContent = 'Select a lecture above before uploading.';
    }
  }

  // ============================================================
  // Browse / view content
  // ============================================================
  function typeTagClass(type) { return `content-type-tag ${type}`; }

  function renderEmbed(item) {
    if (item.type === 'youtube') {
      const idMatch = item.url.match(/(?:v=|youtu\.be\/|embed\/)([a-zA-Z0-9_-]{6,})/);
      const vid = idMatch ? idMatch[1] : null;
      if (vid) {
        return `<div class="content-embed"><iframe src="https://www.youtube.com/embed/${vid}" height="220" allowfullscreen></iframe></div>`;
      }
      return `<div class="content-embed"><a href="${item.url}" target="_blank" class="btn btn-sm btn-outline" style="color:var(--orange);border-color:var(--orange);">Open on YouTube ↗</a></div>`;
    }
    if (item.type === 'spotify') {
      const idMatch = item.url.match(/spotify\.com\/(episode|track|show|album)\/([a-zA-Z0-9]+)/);
      if (idMatch) {
        return `<div class="content-embed"><iframe src="https://open.spotify.com/embed/${idMatch[1]}/${idMatch[2]}" height="152" allow="encrypted-media"></iframe></div>`;
      }
      return `<div class="content-embed"><a href="${item.url}" target="_blank" class="btn btn-sm btn-outline" style="color:var(--blue);border-color:var(--blue);">Open on Spotify ↗</a></div>`;
    }
    return '';
  }

  async function pdfLink(item) {
    if (!item.file_path) return null;
    const { data, error } = await supabase.storage
      .from(STORAGE_BUCKET)
      .createSignedUrl(item.file_path, 60 * 30); // 30 min
    if (error) { console.error(error); return null; }
    return data.signedUrl;
  }

  async function loadContent(lectureId, lectureLabel) {
    els.browseTitle.textContent = lectureLabel;
    els.browseBody.innerHTML = '<div class="load-state">Loading…</div>';

    const { data, error } = await supabase
      .from('content_items')
      .select('*')
      .eq('lecture_id', lectureId)
      .order('created_at', { ascending: false });

    if (error) {
      els.browseBody.innerHTML = `<div class="empty-state">Failed to load content — ${error.message}</div>`;
      return;
    }
    if (!data || data.length === 0) {
      els.browseBody.innerHTML = '<div class="empty-state">No content indexed for this lecture yet. Use the Upload panel below.</div>';
      return;
    }

    const stack = document.createElement('div');
    stack.className = 'content-stack';
    els.browseBody.innerHTML = '';
    els.browseBody.appendChild(stack);

    for (const item of data) {
      const card = document.createElement('div');
      card.className = 'content-card';

      let bodyHtml = '';
      if (item.type === 'text') {
        bodyHtml = `<div class="content-body-text">${escapeHtml(item.body || '')}</div>`;
      } else if (item.type === 'youtube' || item.type === 'spotify') {
        bodyHtml = renderEmbed(item);
      } else if (item.type === 'pdf') {
        bodyHtml = `<div class="content-meta">${item.file_name || 'file.pdf'}${item.file_size ? ' · ' + formatBytes(item.file_size) : ''}</div>`;
      }

      card.innerHTML = `
        <span class="${typeTagClass(item.type)}">${item.type}</span>
        <div>
          <div class="content-title">${escapeHtml(item.title)}</div>
          ${bodyHtml}
          <div class="content-meta">${new Date(item.created_at).toLocaleDateString()}</div>
        </div>
        <div class="content-actions"></div>
      `;

      stack.appendChild(card);

      if (item.type === 'pdf') {
        const actions = card.querySelector('.content-actions');
        const link = await pdfLink(item);
        if (link) {
          actions.innerHTML = `<a href="${link}" target="_blank" class="btn btn-sm btn-accent">View PDF</a>`;
        } else {
          actions.innerHTML = `<span class="content-meta">No file</span>`;
        }
      }
    }
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function formatBytes(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  // ============================================================
  // Upload
  // ============================================================
  document.querySelectorAll('.type-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      activeType = tab.dataset.type;
      document.querySelectorAll('.type-tab').forEach(t => t.classList.toggle('active', t === tab));
      document.querySelectorAll('.type-field').forEach(f => f.classList.toggle('active', f.dataset.type === activeType));
      els.uploadMsg.textContent = '';
    });
  });

  function setUploadMsg(text, ok) {
    els.uploadMsg.textContent = text;
    els.uploadMsg.className = 'form-msg' + (ok === true ? ' ok' : ok === false ? ' err' : '');
  }

  async function handleUpload() {
    if (!supabase) { setUploadMsg('Connect to Supabase first.', false); return; }
    if (!selection.lecture) { setUploadMsg('Select a lecture above first.', false); return; }

    const title = els.fTitle.value.trim();
    if (!title) { setUploadMsg('Title is required.', false); return; }

    els.uploadBtn.disabled = true;
    setUploadMsg('Uploading…', null);

    try {
      const row = { lecture_id: selection.lecture, type: activeType, title };

      if (activeType === 'text') {
        const body = els.fBody.value.trim();
        if (!body) throw new Error('Body text is required.');
        row.body = body;
      }

      if (activeType === 'youtube') {
        const url = els.fUrlYoutube.value.trim();
        if (!url) throw new Error('YouTube URL is required.');
        row.url = url;
      }

      if (activeType === 'spotify') {
        const url = els.fUrlSpotify.value.trim();
        if (!url) throw new Error('Spotify URL is required.');
        row.url = url;
      }

      if (activeType === 'pdf') {
        const file = els.fFile.files[0];
        if (!file) throw new Error('Choose a PDF file.');
        const path = `${selection.lecture}/${Date.now()}_${file.name}`;
        const { error: uploadError } = await supabase.storage
          .from(STORAGE_BUCKET)
          .upload(path, file, { contentType: file.type || 'application/pdf' });
        if (uploadError) throw uploadError;
        row.file_path = path;
        row.file_name = file.name;
        row.file_size = file.size;
        row.mime_type = file.type || 'application/pdf';
      }

      const { error: insertError } = await supabase.from('content_items').insert(row);
      if (insertError) throw insertError;

      setUploadMsg('Uploaded.', true);
      els.fTitle.value = '';
      els.fBody.value = '';
      els.fFile.value = '';
      els.fUrlYoutube.value = '';
      els.fUrlSpotify.value = '';

      loadContent(selection.lecture, els.selLecture.options[els.selLecture.selectedIndex].text);
    } catch (err) {
      console.error(err);
      setUploadMsg(err.message || 'Upload failed.', false);
    } finally {
      els.uploadBtn.disabled = false;
    }
  }

  els.uploadBtn.addEventListener('click', handleUpload);

  // ============================================================
  // Nav scroll
  // ============================================================
  document.querySelectorAll('.nav-link').forEach(link => {
    link.addEventListener('click', e => {
      e.preventDefault();
      const target = document.getElementById(link.dataset.target);
      if (!target) return;
      const offset = 56 + 42;
      const top = target.getBoundingClientRect().top + window.scrollY - offset;
      window.scrollTo({ top, behavior: 'smooth' });
      document.querySelectorAll('.nav-link').forEach(l => l.classList.toggle('active', l === link));
    });
  });

  // ============================================================
  // Init
  // ============================================================
  loadSavedCreds();
})();
</script>
</body>
</html>
